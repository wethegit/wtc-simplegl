<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Particles</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d12;
      }
    </style>
  </head>
  <body>
    <script type="module">
      // Particles simulated on the GPU with transform feedback: one renderer
      // steps them, another draws them from the simulation's latest output.
      // The pointer pushes them around. Everything is freed by `destroy()`.
      import {
        createContext,
        createRenderer,
        loop,
      } from "https://cdn.jsdelivr.net/npm/wtc-simplegl@1.1.0/dist/simplegl.js";

      const COUNT = 20000;

      const simulate = `#version 300 es
in vec2 a_position;
in vec2 a_velocity;
in float a_life;
out vec2 v_position;
out vec2 v_velocity;
out float v_life;
uniform float u_delta;
uniform float u_frame;
uniform vec2 u_pointer;   // clip space
uniform float u_push;

float hash(float n) { return fract(sin(n) * 43758.5453); }

void main() {
  vec2 p = a_position;
  vec2 v = a_velocity;
  float life = a_life - u_delta * 0.25;

  if (life <= 0.0) {
    // Respawn on a ring, with a random lifetime
    float id = float(gl_VertexID);
    float a = hash(id * 12.9898 + u_frame * 78.233) * 6.2831853;
    p = vec2(cos(a), sin(a)) * 0.7;
    v = vec2(0.0);
    life = 0.5 + hash(id * 3.7 + u_frame) * 0.5;
  }

  // Swirl round the centre, and away from the pointer
  float r = max(length(p), 1e-3);
  vec2 swirl = vec2(-p.y, p.x) / r * 0.4;
  vec2 away = p - u_pointer;
  float d = max(length(away), 0.05);
  vec2 push = away / d * u_push * 0.02 / (d * d);
  v = (v + (swirl - p * 0.3 + push) * u_delta) * pow(0.3, u_delta);

  v_position = p + v * u_delta;
  v_velocity = v;
  v_life = life;
  gl_Position = vec4(0.0);
}`;

      const nothing = `#version 300 es
precision highp float;
out vec4 colour;
void main() { colour = vec4(0.0); }`;

      const vert = `#version 300 es
in vec2 a_position;
in vec2 a_velocity;
in float a_life;
uniform float u_aspect;
uniform float u_dpr;
out float v_speed;
out float v_life;
void main() {
  v_speed = length(a_velocity);
  v_life = a_life;
  gl_Position = vec4(a_position * vec2(1.0 / u_aspect, 1.0), 0.0, 1.0);
  gl_PointSize = 2.0 * u_dpr;
}`;

      const frag = `#version 300 es
precision highp float;
in float v_speed;
in float v_life;
out vec4 colour;
void main() {
  float alpha = smoothstep(0.5, 0.2, length(gl_PointCoord - 0.5)) * min(v_life * 4.0, 1.0) * 0.6;
  vec3 rgb = mix(vec3(0.29, 0.62, 1.0), vec3(1.0, 0.45, 0.7), clamp(v_speed * 2.0, 0.0, 1.0));
  colour = vec4(rgb * alpha, alpha); // premultiplied
}`;

      function createParticles(canvas) {
        const controller = new AbortController();
        const { signal } = controller;

        const gl = createContext({
          canvas,
          signal,
          attributes: { alpha: true, premultipliedAlpha: true },
        });

        // Everyone starts dead, with a different lifetime left, so they
        // respawn spread out over the first second
        const life = new Float32Array(COUNT).map(() => -Math.random());

        const simulation = createRenderer(gl, {
          vert: simulate,
          frag: nothing,
          mode: gl.POINTS,
          count: COUNT,
          attributes: {
            a_position: { data: new Float32Array(COUNT * 2), size: 2, component: "transformFeedback", varying: "v_position", usage: gl.DYNAMIC_COPY },
            a_velocity: { data: new Float32Array(COUNT * 2), size: 2, component: "transformFeedback", varying: "v_velocity", usage: gl.DYNAMIC_COPY },
            a_life: { data: life, size: 1, component: "transformFeedback", varying: "v_life", usage: gl.DYNAMIC_COPY },
          },
        });

        const particles = createRenderer(gl, {
          vert,
          frag,
          mode: gl.POINTS,
          count: COUNT,
          attributes: {
            a_position: { from: simulation, size: 2 },
            a_velocity: { from: simulation, size: 2 },
            a_life: { from: simulation, size: 1 },
          },
        });

        // The pointer in the simulation's space: clip space, with x scaled by the aspect
        const pointer = { at: [10, 10], push: 0 };
        canvas.addEventListener(
          "pointermove",
          (e) => {
            const r = canvas.getBoundingClientRect();
            const aspect = r.width / r.height;
            pointer.at = [((e.clientX - r.left) / r.width * 2 - 1) * aspect, 1 - (e.clientY - r.top) / r.height * 2];
            pointer.push = 1;
          },
          { signal }
        );
        canvas.addEventListener("pointerleave", () => (pointer.push = 0), { signal });

        loop(
          (time, delta, frame) => {
            const dt = Math.min(delta, 1 / 30);

            // Step, without drawing
            gl.enable(gl.RASTERIZER_DISCARD);
            simulation.bindVAOs();
            simulation.setUniforms({ u_delta: dt, u_frame: frame % 1000, u_pointer: pointer.at, u_push: pointer.push });
            simulation.render();
            gl.disable(gl.RASTERIZER_DISCARD);

            // Draw, adding up where particles overlap
            gl.clearColor(0, 0, 0, 0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
            particles.bindVAOs();
            particles.setUniforms({
              u_aspect: gl.canvas.width / gl.canvas.height,
              u_dpr: gl.canvas.width / canvas.clientWidth,
            });
            particles.render();
            gl.disable(gl.BLEND);
          },
          { signal }
        );

        return {
          destroy() {
            controller.abort(); // stops the loop, resizing and the pointer listeners
            particles.delete();
            simulation.delete();
          },
        };
      }

      const canvas = document.createElement("canvas");
      canvas.style.cssText = "display:block;width:100vw;height:100vh;touch-action:none";
      document.body.append(canvas);
      const effect = createParticles(canvas);

      // e.g. on a route change or component unmount:
      // effect.destroy(); canvas.remove();
    </script>
  </body>
</html>
